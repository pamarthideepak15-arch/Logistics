<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCM CCM Agent App - Profile</title>
    <link rel="stylesheet" href="../Design System/global.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="agent-app-body">

    <!-- Mobile Device Frame (Compact 375px - 414px) -->
    <div class="caa-app-container">

        <!-- ============================================================ -->
        <!-- 1. MOBILE HEADER WITH BACK CHEVRON                           -->
        <!-- ============================================================ -->
        <header class="caa-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <a href="index.html" class="caa-back-btn" title="Back to Home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </a>
                <span class="caa-brand-text" style="font-size: 0.9375rem;">Profile</span>
            </div>
        </header>

        <!-- ============================================================ -->
        <!-- 2. SCROLLABLE VIEWPORT — AGENT PROFILE DETAILS               -->
        <!-- ============================================================ -->
        <main class="caa-viewport">
            <div class="caa-profile-screen-wrap">

                <!-- Clean High-Fidelity Profile Card -->
                <div class="caa-profile-card-premium">
                    <div class="caa-avatar-hero">DK</div>
                    <div class="caa-profile-hero-name">Deepak Kumar</div>
                    <div class="caa-profile-hero-role">CCM Agent</div>
                    <div class="caa-profile-hero-branch">Bengaluru Branch</div>
                    <div class="caa-profile-hero-empid">AGT-1042</div>
                </div>

                <!-- Bottom Section: Logout Action Row Button -->
                <a href="login.html" class="caa-logout-row-btn" title="Logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </a>

            </div>
        </main>

        <!-- ============================================================ -->
        <!-- 3. BOTTOM NAVIGATION (Fixed, Exactly 5 Items)                -->
        <!-- ============================================================ -->
        <nav class="caa-bottom-nav">
            <!-- 1. Home -->
            <a href="index.html" class="caa-nav-item">
                <div class="caa-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </div>
                <span class="caa-nav-label">Home</span>
            </a>

            <!-- 2. Calls -->
            <a href="calls.html" class="caa-nav-item">
                <div class="caa-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                </div>
                <span class="caa-nav-label">Calls</span>
            </a>

            <!-- 3. Customers -->
            <a href="customers.html" class="caa-nav-item">
                <div class="caa-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <span class="caa-nav-label">Customers</span>
            </a>

            <!-- 4. Leads -->
            <a href="leads.html" class="caa-nav-item">
                <div class="caa-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <polyline points="17 11 19 13 23 9"></polyline>
                    </svg>
                </div>
                <span class="caa-nav-label">Leads</span>
            </a>

            <!-- 5. Tickets -->
            <a href="tickets.html" class="caa-nav-item">
                <div class="caa-nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="9" y1="13" x2="15" y2="13"></line>
                        <line x1="9" y1="17" x2="13" y2="17"></line>
                    </svg>
                </div>
                <span class="caa-nav-label">Tickets</span>
            </a>
        </nav>

    </div>

</body>
</html>
