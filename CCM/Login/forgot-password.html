<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Logistics Management Platform</title>
    <link rel="stylesheet" href="../Design System/global.css">
    <link rel="stylesheet" href="login.css">
    <style>
        .back-to-login-wrapper {
            text-align: center;
            margin-top: 16px;
        }
        .back-to-login-link {
            font-size: 0.8125rem;
            color: #666;
            text-decoration: none;
            font-family: var(--font-family-primary);
            font-weight: 700;
            transition: color 0.2s ease;
        }
        .back-to-login-link:hover {
            color: var(--color-black);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="login-page-container">
        <section class="login-container">
            <header class="product-header">
                <h1>Logistics Management Platform</h1>
                <h2>Forgot Password</h2>
            </header>

            <form class="login-form" action="reset-password.html" method="GET">
                <div class="input-group">
                    <label for="credentials">Email ID / Username</label>
                    <input type="text" id="credentials" name="credentials" placeholder="Enter Email ID or Username" required>
                </div>
                <button type="submit" class="login-button">Send Reset Link</button>
                <div class="back-to-login-wrapper">
                    <a href="index.html" class="back-to-login-link">&larr; Back to Login</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
