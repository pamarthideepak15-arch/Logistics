<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCM - Add Branch - Logistics Management Platform</title>
    <link rel="stylesheet" href="../Design System/global.css">
    <link rel="stylesheet" href="../Design System/components.css">
    <link rel="stylesheet" href="../Sidebar/sidebar.css">
    <link rel="stylesheet" href="company-branches.css">
</head>
<body>
    
    <!-- Mobile Menu Drawer Toggle -->
    <input type="checkbox" id="mobile-menu-toggle">
    <label for="mobile-menu-toggle" class="mobile-menu-btn" title="Open Navigation Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </label>

    <div class="app-layout">
        
        <!-- Two-Tier Dark Sidebar (CCM Admin navigation) -->
        <aside class="sidebar">
            <!-- Left Rail -->
            <div class="sidebar-rail">
                <div class="sidebar-logo-container">
                    <div class="sidebar-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                    </div>
                </div>
                
                <nav class="rail-nav">
                    <a href="index.html" class="rail-icon active" data-tooltip="CCM">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                        </svg>
                    </a>
                </nav>
            </div>

            <!-- Right Menu Pane -->
            <div class="sidebar-menu">
                <div class="sidebar-header">
                    <div class="sidebar-title">Logistics ERP</div>
                    <div class="sidebar-badge">ONLINE</div>
                </div>

                <div class="sidebar-nav-section">TELEPHONY &amp; CRM</div>
                <nav class="sidebar-nav">
                    <a href="index.html" class="active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="21" width="18" height="2"></rect>
                            <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"></path>
                            <path d="M9 9h1"></path>
                            <path d="M9 13h1"></path>
                            <path d="M9 17h1"></path>
                            <path d="M14 9h1"></path>
                            <path d="M14 13h1"></path>
                            <path d="M14 17h1"></path>
                        </svg>
                        Company &amp; Branches
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-content">
            
            <!-- Top Header -->
            <header class="top-header">
                <div class="top-breadcrumb">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span>Home</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    <span>CCM</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    <a href="index.html" style="color: inherit; text-decoration: none;">Company &amp; Branches</a>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    <span class="current">Add Branch</span>
                </div>
                <div class="top-profile-block">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <div class="profile-info">
                        <strong>Super Admin</strong>
                        <span>HQ-NODE-01</span>
                    </div>
                    <a href="../Login/welcome.html" class="logout-btn" title="Back to Welcome">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </a>
                </div>
            </header>

            <div class="main-scroll-area">
                <form action="index.html">
                    <div class="page-header">
                        <div style="display: flex; align-items: flex-start; gap: 12px;">
                            <a href="index.html" style="color: inherit; text-decoration: none; font-size: 1.25rem; font-weight: 700; line-height: 1.1; margin-top: 2px;">&lt;</a>
                            <div class="page-title-group">
                                <h1 class="page-title" style="line-height: 1.2; margin-bottom: 4px;">Add Branch</h1>
                                <p class="page-subtitle">Add a dedicated telephony number for a branch location.</p>
                            </div>
                        </div>
                        <div class="header-actions">
                            <a href="index.html" class="btn-secondary">Cancel</a>
                            <button type="submit" class="btn-primary">Save Branch</button>
                        </div>
                    </div>

                    <div class="ccm-form-container">
                        <div class="form-group">
                            <label for="new-branch-name">Branch *</label>
                            <select id="new-branch-name" name="branch-name" required>
                                <option value="">Select Branch</option>
                                <option value="Mangalore">Mangalore</option>
                                <option value="Bengaluru">Bengaluru</option>
                                <option value="Hyderabad">Hyderabad</option>
                                <option value="Mumbai Hub">Mumbai Hub</option>
                                <option value="Delhi Agency">Delhi Agency</option>
                                <option value="Chennai Hub">Chennai Hub</option>
                                <option value="Pune Hub">Pune Hub</option>
                            </select>
                        </div>
                        
                        <div class="form-group" style="margin-top: 16px;">
                            <label for="new-dedicated-number">Dedicated Number *</label>
                            <input type="text" id="new-dedicated-number" name="dedicated-number" placeholder="e.g. +91 98765 10004" required>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
