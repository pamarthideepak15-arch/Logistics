<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Booking - Logistics Management Platform</title>
    <link rel="stylesheet" href="../Design System/global.css">
    <link rel="stylesheet" href="../Design System/components.css">
    <link rel="stylesheet" href="../Sidebar/sidebar.css">
</head>
<body>
    
    <input type="checkbox" id="mobile-menu-toggle">
    <label for="mobile-menu-toggle" class="mobile-menu-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </label>

    <div class="app-layout">
        
        <aside class="sidebar">
            <div class="sidebar-rail">
                <div class="sidebar-logo-container">
                    <div class="sidebar-logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                    </div>
                </div>
                <nav class="rail-nav">
                    <a href="../User-Management/index.html" class="rail-icon" data-tooltip="Administration">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    </a>
                    <a href="index.html" class="rail-icon active" data-tooltip="Counter Booking">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    </a>
                    <a href="#" class="rail-icon" data-tooltip="Masters">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                    </a>
                    <a href="#" class="rail-icon" data-tooltip="Logistics Operations">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                    </a>
                    <a href="#" class="rail-icon" data-tooltip="Accounts">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12" /><path d="M6 8h12" /><path d="m6 13 8.5 8" /><path d="M6 13h3" /><path d="M9 13c6.667 0 6.667-10 0-10" /></svg>
                    </a>
                    <a href="#" class="rail-icon" data-tooltip="HR">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </a>
                </nav>
            </div>
            <div class="sidebar-menu">
                <div class="sidebar-header">
                    <div class="sidebar-title">Logistics ERP</div>
                    <div class="sidebar-badge">ONLINE</div>
                </div>
                
                <div class="sidebar-nav-section">COUNTER BOOKING</div>
                <nav class="sidebar-nav">
                    <a href="index.html" class="active">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                        Counter Booking
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="app-content">
            <header class="top-header">
                <div class="top-breadcrumb">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span>Home</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    <a href="index.html" style="color: inherit; text-decoration: none;">Counter Booking</a>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 12px; height: 12px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    <span class="current">Edit Booking</span>
                </div>
                <div class="top-profile-block">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    <div class="profile-info">
                        <strong>Super Admin</strong>
                        <span>HQ-NODE-01</span>
                    </div>
                    <a href="../Login/index.html" class="logout-btn" title="Logout">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </a>
                </div>
            </header>

            <div class="main-scroll-area">
                <form action="index.html">
                    <div class="page-header">
                        <div style="display: flex; align-items: flex-start; gap: 12px;">
                            <a href="index.html" style="color: inherit; text-decoration: none; font-size: 1.25rem; font-weight: 700; line-height: 1.1; margin-top: 2px;">&lt;</a>
                            <div class="page-title-group">
                                <h1 class="page-title" style="line-height: 1.2; margin-bottom: 4px;">Edit Booking</h1>
                                <p class="page-subtitle">Update LR details, status, and item properties.</p>
                            </div>
                        </div>
                        <div class="header-actions">
                            <a href="index.html" class="btn-secondary">Cancel</a>
                            <button type="submit" class="btn-primary">Save Changes</button>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group" style="grid-column: span 1;">
                            <label>LR Number</label>
                            <input type="text" class="form-input" value="LR-100234" disabled style="background-color: #f5f5f5; cursor: not-allowed;">
                        </div>
                        
                        <div class="form-group" style="grid-column: span 1;">
                            <label for="status">Status *</label>
                            <details class="custom-select-wrapper" id="status">
                                <summary class="custom-select-trigger">
                                    <span class="placeholder">Select Status</span>
                                    <span class="selected-text text-booked">Booked</span>
                                    <span class="selected-text text-in_transit">In Transit</span>
                                    <span class="selected-text text-delivered">Delivered</span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </summary>
                                <div class="custom-select-options">
                                    <label class="custom-option">
                                        <input type="radio" name="status" value="booked" checked> Booked
                                    </label>
                                    <label class="custom-option">
                                        <input type="radio" name="status" value="in_transit"> In Transit
                                    </label>
                                    <label class="custom-option">
                                        <input type="radio" name="status" value="delivered"> Delivered
                                    </label>
                                </div>
                            </details>
                        </div>

                        <div class="form-group" style="grid-column: span 2;">
                            <label>Pickup Address *</label>
                            <textarea class="form-input" rows="2">123 Industrial Area, Phase 1, Delhi</textarea>
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Delivery Address *</label>
                            <textarea class="form-input" rows="2">456 Transport Nagar, Jaipur, Rajasthan</textarea>
                        </div>

                        <div class="form-group" style="grid-column: span 2;">
                            <label>Items *</label>
                            <textarea class="form-input" rows="2">Machinery Parts (2 Boxes)</textarea>
                        </div>

                        <div class="form-group" style="grid-column: span 1;">
                            <label>Weight (kg) *</label>
                            <input type="number" class="form-input" value="1500">
                        </div>

                        <div class="form-group" style="grid-column: span 1;">
                            <label for="payment-details">Payment Details *</label>
                            <details class="custom-select-wrapper" id="payment-details">
                                <summary class="custom-select-trigger">
                                    <span class="placeholder">Select Payment</span>
                                    <span class="selected-text text-paid">Paid</span>
                                    <span class="selected-text text-topay">To-Pay</span>
                                    <span class="selected-text text-credit">Credit</span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                </summary>
                                <div class="custom-select-options">
                                    <label class="custom-option">
                                        <input type="radio" name="payment-details" value="paid" checked> Paid
                                    </label>
                                    <label class="custom-option">
                                        <input type="radio" name="payment-details" value="topay"> To-Pay
                                    </label>
                                    <label class="custom-option">
                                        <input type="radio" name="payment-details" value="credit"> Credit
                                    </label>
                                </div>
                            </details>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="../Design System/dropdown.js"></script>
</body>
</html>
