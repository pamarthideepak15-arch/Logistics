                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Customer Type *</label>

                                <label style="flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.8125rem; font-weight: 500; border: 1px solid var(--color-border); border-radius: var(--border-radius-base); padding: 6px 10px; box-sizing: border-box;">
                                    <input type="radio" name="customer-type" id="type-individual" value="individual" style="width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: #000000; outline: none;">

                                </label>
                                <label style="flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.8125rem; font-weight: 500; border: 1px solid var(--color-border); border-radius: var(--border-radius-base); padding: 6px 10px; box-sizing: border-box;">
                                    <input type="radio" name="customer-type" id="type-business" value="business" checked style="width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: #000000; outline: none;">
                                    Business
                                </label>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" id="name" name="name" value="Logistics Corp Ltd." required>
                        </div>

                        <div class="form-group">
                            <label for="mobile-number">Mobile Number *</label>
                            <div class="input-with-prefix">

                                <input type="text" id="mobile-number" name="mobile-number" value="99887 76655" required>
                            </div>
                        </div>

                        <div class="form-group business-fields">
                            <label for="company-name">Company Name *</label>
                            <input type="text" id="company-name" name="company-name" value="Logistics Corp Ltd.">
                        </div>

                        <div class="form-group business-fields">
                            <label for="gst-number">GST Number *</label>
                            <input type="text" id="gst-number" name="gst-number" value="27AADCB2230M1Z2">
                        </div>

                        <div class="form-group business-fields">
                            <label for="credit-limit">Credit Limit *</label>
