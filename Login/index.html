<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Management Platform - Login</title>
    <link rel="stylesheet" href="../Design System/global.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-page-container">
        <!-- Admin Login UI Card -->
        <section class="login-container" id="admin-login-card">
            <header class="product-header">
                <h1>Logistics Management Platform</h1>
                <h2 id="login-title">Login</h2>
            </header>

            <div id="admin-login">
                <form class="login-form" action="welcome.html" method="GET">
                    <div class="input-group">
                        <label for="credentials">Email ID / Username</label>
                        <input type="text" id="credentials" name="credentials" placeholder="Enter Email ID or Username" value="admin@logistics.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter Password" value="password123" required>
                        <div class="forgot-password-wrapper">
                            <a href="forgot-password.html" class="forgot-password-link">Forgot Password?</a>
                        </div>
                    </div>
                    <button type="submit" class="login-button">Login</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
