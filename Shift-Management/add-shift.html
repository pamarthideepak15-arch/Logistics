    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startHours = document.getElementsByName('start-hour');
            const startMinutes = document.getElementsByName('start-minute');
            const startPeriods = document.getElementsByName('start-period');
            
            const endHours = document.getElementsByName('end-hour');
            const endMinutes = document.getElementsByName('end-minute');
            const endPeriods = document.getElementsByName('end-period');
            
            const workingHoursField = document.getElementById('working-hours-field');
            
            function calculateHours() {
                let sh = null, sm = null, sp = null;
                let eh = null, em = null, ep = null;
                
                for (let r of startHours) { if (r.checked) sh = r.value; }
                for (let r of startMinutes) { if (r.checked) sm = r.value; }
                for (let r of startPeriods) { if (r.checked) sp = r.value; }
                
                for (let r of endHours) { if (r.checked) eh = r.value; }
                for (let r of endMinutes) { if (r.checked) em = r.value; }
                for (let r of endPeriods) { if (r.checked) ep = r.value; }
                
                if (!sh || !sm || !sp || !eh || !em || !ep) {
                    if (workingHoursField) workingHoursField.value = '—';
                    return;
                }
                
                let startH = parseInt(sh);
                if (sp === 'PM' && startH < 12) startH += 12;
                if (sp === 'AM' && startH === 12) startH = 0;
                let startMins = startH * 60 + parseInt(sm);
                
                let endH = parseInt(eh);
                if (ep === 'PM' && endH < 12) endH += 12;
                if (ep === 'AM' && endH === 12) endH = 0;
                let endMins = endH * 60 + parseInt(em);
                
                let diffMins = endMins - startMins;
                if (diffMins <= 0) {
                    diffMins += 24 * 60;
                }
                
                let diffHours = diffMins / 60;
                let display = Number.isInteger(diffHours) ? (diffHours + 'h') : (diffHours.toFixed(1) + 'h');
                if (workingHoursField) workingHoursField.value = display;
            }
            
            // Listen for changes on custom option options input elements
            document.querySelectorAll('.custom-select-wrapper input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', calculateHours);
            });
            
            // Form Submit handler
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    const code = document.getElementById('shift-code').value.trim();
                    const name = document.getElementById('shift-name').value.trim();
                    
                    let staffShifts = [];
                    if (localStorage.getItem('staffShifts')) {
                        staffShifts = JSON.parse(localStorage.getItem('staffShifts'));
                    }
                    
                    if (staffShifts.some(s => s.code.toLowerCase() === code.toLowerCase())) {
                        alert('Error: Shift Code must be unique. This code is already in use.');
                        return;
                    }

                    let sh = null, sm = null, sp = null;
                    let eh = null, em = null, ep = null;
                    for (let r of startHours) { if (r.checked) sh = r.value; }
                    for (let r of startMinutes) { if (r.checked) sm = r.value; }
                    for (let r of startPeriods) { if (r.checked) sp = r.value; }
                    for (let r of endHours) { if (r.checked) eh = r.value; }
                    for (let r of endMinutes) { if (r.checked) em = r.value; }
                    for (let r of endPeriods) { if (r.checked) ep = r.value; }

                    if (!sh || !sm || !sp || !eh || !em || !ep) {
                        alert('Please fill out Start Time and End Time fields.');
                        return;
                    }

                    const startTime = `${sh}:${sm} ${sp}`;
                    const endTime = `${eh}:${em} ${ep}`;
                    const hours = workingHoursField.value;

                    const newShift = {
                        code: code,
                        name: name,
                        start: startTime,
                        end: endTime,
                        hours: hours,
                        status: true
                    };

                    staffShifts.push(newShift);
                    localStorage.setItem('staffShifts', JSON.stringify(staffShifts));

                    window.location.href = 'index.html';
                });
            }

            calculateHours();
        });
    </script>
